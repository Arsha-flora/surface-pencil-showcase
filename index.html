<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0a">
  <title>Surface Pencil | Arsha Flora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(
        circle at center,
        #1c321b 0%,
        #080d0a 70%
      );
      color: #edf3e9;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 750px;
      padding: 65px 35px;
      background: #101911;
      border: 1px solid #385634;
      border-radius: 24px;
      box-shadow: 0 25px 80px #0008;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      color: #c6fa67;
      background: #21341d;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 72px);
      margin: 25px 0 12px;
    }

    h1 span {
      color: #c6fa67;
    }

    p {
      color: #a9bea5;
      line-height: 1.9;
      font-size: 17px;
    }

    .success {
      margin-top: 35px;
      padding: 18px;
      border: 1px solid #4e793e;
      border-radius: 12px;
      color: #c6fa67;
      font-size: 17px;
    }

    footer {
      margin-top: 35px;
      color: #698666;
      font-size: 12px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">BLENDER ADD-ON</div>

    <h1>Surface <span>Pencil.</span></h1>

    <p>
      A powerful and flexible scattering tool
      designed for Blender artists.
    </p>

    <div class="success">
      ✓ Website is working successfully!
    </div>

    <p>
      Our official Surface Pencil showcase
      is coming soon.
    </p>

    <footer>CREATED BY ARSHA FLORA</footer>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="responsive-embedded-sizing" content="allow-origins=*">
<meta name="theme-color" content="#080d0a"><title>Surface Pencil — Arsha Flora</title>
<style>
:root{--bg:#080d0a;--panel:#111a13;--line:#30452c;--text:#edf3e9;--muted:#b0c1ac;--accent:#c6fa67;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3,p{margin:0}main{max-width:1120px;margin:auto;overflow:hidden}section{padding:clamp(24px,4.5vw,48px) clamp(16px,3.8vw,38px);border-bottom:1px solid var(--line)}h1{font-size:clamp(38px,6.8vw,72px);letter-spacing:-.055em;line-height:1.08;margin:24px 0 16px}h1 em,h2 em{color:var(--accent);font-style:normal}h2{font-size:clamp(26px,4.2vw,43px);line-height:1.13;letter-spacing:-.04em;margin-bottom:15px}h3{font-size:clamp(21px,2.7vw,30px);line-height:1.18;letter-spacing:-.03em;margin-bottom:12px}p{color:var(--muted)}.eyebrow,.label{color:var(--accent);font-weight:800;letter-spacing:.12em;font-size:11px}.hero{background:radial-gradient(ellipse at top right,#304d2580,transparent 65%),linear-gradient(145deg,#142319,#080d0a)}.language-label{font-size:12px;color:#a1b69d;margin:14px 0 8px}.languages{display:flex;flex-wrap:wrap;gap:7px}.languages button{font:600 12px/1.3 system-ui,sans-serif;border:1px solid #46623b;background:#17251a;color:#e0ebdc;padding:8px 12px;border-radius:99px;cursor:pointer}.languages button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#12190e}.languages button:hover,.languages button:focus-visible{border-color:var(--accent);outline:2px solid #c6fa6755;outline-offset:2px}.linked{background:radial-gradient(ellipse at 100% 0%,#253d1b80,transparent 60%),#0c140e}.linked h2{margin-top:10px;max-width:850px}.linked .lead{font-size:16px;max-width:900px}.wire{padding:18px 20px;background:linear-gradient(135deg,#2d1a1b,#171211);border:1px solid #78403a;border-radius:15px;margin:22px 0}.wire h3{color:#ff8782;font-size:20px;margin-bottom:7px}.wire p{color:#d7bcb8}.media{position:relative;aspect-ratio:2/1;border-radius:15px;overflow:hidden;background:#111b13;border:1px solid #354c31}.media img,.media video{width:100%;height:100%;display:block;object-fit:contain}.media .missing{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:20px;color:#a8bca3;font-size:13px}.media.failed img,.media.failed video{visibility:hidden}.media.failed .missing{display:grid}.proof{margin-top:22px}.proof h3{color:var(--accent);margin-top:18px}.proof p{font-size:14px}.features{background:#0a110b}.features>h2{margin-bottom:26px}.feature{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);gap:clamp(15px,3vw,28px);align-items:center;padding:23px 0;border-top:1px solid #263827}.feature:nth-of-type(even){grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr)}.feature:nth-of-type(even) .media{order:-1}.feature .label{margin-bottom:10px;display:block}.feature p{font-size:14px}.tour-intro{background:#101a12;padding-bottom:20px}.tour-intro h2{margin-bottom:10px}.tour-intro .instruction{color:var(--accent);font-weight:750;margin-bottom:8px}.tour-intro p:last-child{font-size:13px}.tour-frame{display:block;width:100%;height:720px;border:0;background:#0a100b}.continue{padding:17px 20px;text-align:center;color:var(--accent);font-weight:700;font-size:13px;background:#101a12}.worldwide p+p{margin-top:16px}.worldwide .languages{margin-top:20px}.worldwide .languages span{font-size:12px;border:1px solid #46623b;border-radius:30px;padding:5px 11px;color:#d4e4cf}.thanks{border-bottom:0;text-align:center;background:linear-gradient(180deg,#142018,#080d0a)}.thanks h2{color:var(--accent);font-size:27px}.thanks p{max-width:740px;margin:0 auto 14px}.thanks .closing{font-weight:750;color:#edf3e9}.thanks .signoff{color:var(--accent);letter-spacing:.16em;font-size:11px;font-weight:800;margin-bottom:0}@media(max-width:600px){.feature,.feature:nth-of-type(even){grid-template-columns:1fr;gap:12px;padding:21px 0}.feature .media,.feature:nth-of-type(even) .media{order:-1}.feature .label{margin-bottom:6px}.feature h3{margin-bottom:8px}section{padding:26px 16px}.hero h1{font-size:39px}.tour-frame{height:720px}.proof h3{font-size:21px}.wire{padding:14px}.languages button{padding:7px 9px;font-size:11px}}
</style></head>
<body><main>
<section class="hero"><p class="eyebrow" data-t="0"></p><p class="language-label" data-t="1"></p><div class="languages" id="languages" role="group"></div><h1>Surface <em>Pencil.</em><br><span data-t="2"></span></h1><p data-t="3"></p></section>
<section class="linked"><p class="eyebrow" data-t="4"></p><h2 data-t="5"></h2><p class="lead" data-t="6"></p><div class="wire"><h3 data-t="7"></h3><p data-t="8"></p></div><div class="proof"><div class="media"><video src="video/video6.mp4" width="1200" height="600" autoplay muted loop playsinline controls preload="metadata"></video><span class="missing" data-t="34"></span></div><h3 data-t="9"></h3><p data-t="10"></p></div></section>
<section class="features"><h2 data-t="11"></h2><div id="features"></div></section>
<section class="tour-intro"><h2 data-t="22"></h2><p class="instruction" data-t="23"></p><p data-t="24"></p></section>
<iframe class="tour-frame" id="tour" src="tour.html" title="Surface Pencil interactive feature tour" width="100%" height="720" scrolling="yes" loading="lazy"></iframe>
<div class="continue" data-t="25"></div>
<section class="worldwide"><h2 data-t="26"></h2><p data-t="27"></p><p data-t="28"></p><div class="languages" id="language-list"></div></section>
<section class="thanks"><h2 data-t="29"></h2><p data-t="30"></p><p data-t="31"></p><p class="closing" data-t="32"></p><p class="signoff" data-t="33"></p></section>
</main>
<script src="i18n.js"></script><script>
'use strict';
const frame=document.getElementById('tour'), languages=document.getElementById('languages');let selected='en';
for(const [code,name] of SP_LANGS){const b=document.createElement('button');b.type='button';b.textContent=name;b.lang=code;b.dataset.lang=code;b.addEventListener('click',()=>setLanguage(code));languages.append(b);const item=document.createElement('span');item.lang=code;item.textContent=name;document.getElementById('language-list').append(item);}
for(let i=0;i<5;i++){const row=document.createElement('article');row.className='feature';row.innerHTML=`<div><span class="label" data-feature="${i+1}"></span><h3 data-t="${12+i*2}"></h3><p data-t="${13+i*2}"></p></div><div class="media"><img src="video/video${i+1}.webp" width="1200" height="600" loading="lazy" decoding="async"><span class="missing" data-t="34"></span></div>`;document.getElementById('features').append(row);}
for(const img of document.querySelectorAll('.media img')){const fail=()=>img.parentElement.classList.add('failed');img.addEventListener('error',fail);if(img.complete&&!img.naturalWidth)fail();}
const proofVideo=document.querySelector('.proof video');proofVideo.addEventListener('error',()=>proofVideo.parentElement.classList.add('failed'));if(proofVideo.error)proofVideo.parentElement.classList.add('failed');
function syncTour(){frame.contentWindow?.postMessage({type:'surface-pencil-language',lang:selected},location.origin);}
function setLanguage(code){selected=spLanguage(code);const t=SP_PAGE[selected];document.documentElement.lang=selected;languages.setAttribute('aria-label',t[1]);document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[Number(el.dataset.t)]);document.querySelectorAll('[data-feature]').forEach(el=>el.textContent=`${t[35]} ${String(el.dataset.feature).padStart(2,'0')} / 05`);for(const b of languages.children)b.setAttribute('aria-pressed',String(b.dataset.lang===selected));document.querySelector('.proof video').setAttribute('aria-label',t[9]);document.querySelectorAll('.feature img').forEach((im,i)=>im.alt=t[12+i*2]);frame.title=t[22];syncTour();}
frame.addEventListener('load',syncTour);window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='surface-pencil-tour-ready')syncTour();});setLanguage('en');
</script></body></html>

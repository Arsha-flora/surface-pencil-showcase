<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="responsive-embedded-sizing" content="allow-origins=https://superhivemarket.com">
<meta name="theme-color" content="#080d0a">
<title>Surface Pencil — Arsha Flora</title>
<link rel="preload" as="image" href="assets/ui.png">
<style>
:root{--bg:#080d0a;--accent:#c6fa67;--ink:#edf4ea;--muted:#a6b9a7;--story-h:3200px;--stage-h:520px;--intro-h:460px;--end-h:100px}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}body{overflow-x:clip}h1,h2,p{margin:0}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.intro{height:var(--intro-h);display:flex;align-items:center;background:radial-gradient(ellipse at 85% 0%,#263f1b,transparent 68%),#080d0a;border-bottom:1px solid #2a4028}.kicker{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.19em;font-weight:800;text-transform:uppercase;color:var(--accent);margin-bottom:17px}.kicker:before{content:'';width:24px;height:1px;background:currentColor}h1{font-size:clamp(48px,8vw,94px);letter-spacing:-.07em;line-height:1.02;font-weight:850}h1 em,h2 em{font-style:normal;color:var(--accent)}.intro .lead{font-size:clamp(15px,2vw,19px);color:var(--muted);margin:19px 0 23px;max-width:700px}.intro .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 12px;border:1px solid #365033;border-radius:99px;color:#c6d9bf;font-size:11px;letter-spacing:.04em}.story{height:var(--story-h);position:relative;overflow:clip;background:radial-gradient(ellipse at 50% 15%,#20331c55,transparent 65%),#0a100b;--accent:#c6fa67;--tint:#203318;--border:#3a5334;transition:background-color .35s}.story[data-tone="red"]{--accent:#ff6262;--tint:#361c1c;--border:#79403d;background-color:#180b0b}.markers{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.marker{position:absolute;left:0;width:100%;height:12px;pointer-events:none}.stage{height:var(--stage-h);position:absolute;top:0;left:0;right:0;will-change:transform;display:flex;align-items:center;z-index:1;pointer-events:none}.stage-inner{width:min(1120px,calc(100% - 40px));margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:clamp(16px,4vw,48px);align-items:center;pointer-events:auto}.copy{position:relative;min-width:0;padding:20px 0}.step-no{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:17px;transition:color .3s}.step-no:before{content:'';width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 13px var(--accent)}h2{font-size:clamp(27px,4.8vw,56px);line-height:1.06;letter-spacing:-.045em;font-weight:820;margin-bottom:17px;overflow-wrap:anywhere}.description{font-size:clamp(14px,1.8vw,17px);line-height:1.75;color:var(--muted);max-width:460px}.note{margin-top:19px;padding:12px 13px;border:1px solid var(--border);background:var(--tint);border-radius:10px;font-size:12px;color:#e0ebdc;transition:background .35s,border-color .35s}.copy-body{animation:enter .24s ease both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.nav{display:flex;gap:7px;margin-top:25px;align-items:center}.nav span{height:4px;flex:1;max-width:32px;border-radius:6px;background:#3c4b3d;transition:background .3s}.nav span.active{background:var(--accent);box-shadow:0 0 9px var(--accent)}.visual{min-width:0;position:relative;perspective:1000px}.window{background:linear-gradient(150deg,var(--tint),#0a100c 75%);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 20px 70px #0006;transition:background .4s,border-color .4s;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg)) rotateZ(var(--rz,0deg));transform-origin:center;will-change:transform;transition:transform .32s cubic-bezier(.22,.7,.2,1),border-color .3s,background .3s}.bar{height:40px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:10px;color:#aabdac;font-weight:700;letter-spacing:.1em}.lights{display:flex;gap:5px}.lights i{width:6px;height:6px;border-radius:50%;background:#728475}.bar b{color:var(--accent);font-weight:800}.viewport{position:relative;height:414px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:9px 15px 0;isolation:isolate}.panel{position:relative;width:min(100%,300px);flex:none;transform:translateY(var(--pan,0px));transition:transform .32s cubic-bezier(.22,.7,.2,1);border-radius:6px;box-shadow:0 0 0 1px #ffffff14}.panel img{width:100%;height:auto;display:block;border-radius:6px}.dot{position:absolute;left:var(--x,12%);top:var(--y,20%);width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent),0 0 22px var(--accent);transition:left .30s cubic-bezier(.22,.7,.2,1),top .30s cubic-bezier(.22,.7,.2,1),background .3s,box-shadow .3s;z-index:3}.dot:after{content:'';position:absolute;inset:-8px;border:1px solid var(--accent);border-radius:50%;animation:pulse 1.7s infinite}@keyframes pulse{from{transform:scale(.7);opacity:.9}to{transform:scale(1.7);opacity:0}}.focus{position:absolute;top:var(--fy,12%);left:var(--fx,2%);width:var(--fw,96%);height:var(--fh,11%);border:1.5px solid var(--accent);border-radius:6px;background:color-mix(in srgb,var(--accent) 6%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 23%,transparent);z-index:2;transition:top .30s,left .30s,width .30s,height .30s,border-color .3s,background .3s}.shade{position:absolute;bottom:0;left:0;right:0;height:45px;background:linear-gradient(transparent,#0a100c);z-index:4;pointer-events:none}.window-foot{border-top:1px solid var(--border);padding:10px 13px;color:var(--accent);font-size:10px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}.end{height:var(--end-h);display:flex;align-items:center;justify-content:center;color:#91aa8e;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid #2a4028}.noscript{padding:20px}
@media(max-width:610px){:root{--stage-h:590px}.wrap,.stage-inner{width:calc(100% - 26px)}.intro{align-items:center}.intro .lead{margin:16px 0}.stage-inner{grid-template-columns:1fr;gap:12px}.visual{order:-1}.viewport{height:258px;padding-top:7px}.panel{width:min(100%,235px)}.bar{height:30px}.window-foot{padding:6px 12px}.window{border-radius:13px;transform:rotateZ(var(--rz,0deg))}.copy{padding:0 4px}.step-no{margin-bottom:7px;font-size:10px}h2{font-size:clamp(25px,6vw,36px);margin-bottom:9px}.description{font-size:13px;line-height:1.55}.note{margin-top:9px;padding:8px 10px;font-size:11px;line-height:1.45}.nav{margin-top:12px}.chip{padding:5px 9px}.intro h1{font-size:clamp(42px,11vw,65px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Native sticky for the standalone site; embedded mode follows the host clipping edge. */
html:not(.embedded) .stage{position:sticky;top:12px;transform:none!important;will-change:auto}
.stage{transition:none!important;contain:layout style;}
.stage-inner{height:100%;align-items:center;}
.visual{align-self:center;}
.panel{transform:none!important;transition:none!important;}
.panel img{aspect-ratio:546/1880;}
.window{transform:rotateY(var(--ry,0deg));transform-origin:50% 50%;transition:transform .24s ease-out,border-color .3s,background .3s;}
@media(max-width:610px){
 .stage-inner{grid-template-rows:324px minmax(0,1fr);align-items:start;gap:12px;}
 .visual{align-self:start;}
 .viewport{height:258px;padding-top:7px;}
 .panel{width:min(100%,195px);}
 .window{transform:none;}
 .copy{align-self:start;}
}


/* In Superhive the iframe itself is pinned by the host's native CSS.
   Never translate the entire stage in response to external scroll. */
html,body{height:100%;overflow:hidden;}
.story{height:100%;overflow:hidden;}
html:not(.embedded) .stage,.stage{position:relative;top:0;height:100%;transform:none!important;will-change:auto;}
.stage-inner{height:100%;}
@media(max-width:610px){.stage-inner{grid-template-rows:324px minmax(0,1fr);padding-top:10px;}}
</style>
</head>
<body>
<section class="story" id="story" data-tone="green" aria-label="Surface Pencil feature tour">
  <div class="markers" id="markers" aria-hidden="true"></div>
  <div class="stage" id="stage">
    <div class="stage-inner">
      <div class="copy"><div class="copy-body" id="copy-body"><div class="step-no" id="step-no">01 / 06 — SOURCE MESHES</div><h2 id="title">Your assets.<br><em>Your rules.</em></h2><p class="description" id="description">Choose one or more source meshes and control the contribution of each object independently.</p><div class="note" id="note">Mix different assets with the Amount control for natural variation.</div></div><div class="nav" id="nav" aria-hidden="true"></div></div>
      <div class="visual"><div class="window" id="window"><div class="bar"><span class="lights"><i></i><i></i><i></i></span><span>SURFACE PENCIL</span><b id="bar-label">SOURCE MESHES</b></div><div class="viewport" id="viewport"><div class="panel" id="panel"><img id="ui" src="assets/ui.png" width="546" height="1880" fetchpriority="high" decoding="async" alt="Actual Surface Pencil Blender interface"><div class="focus" id="focus" aria-hidden="true"></div><div class="dot" aria-hidden="true"></div></div><div class="shade"></div></div><div class="window-foot" id="window-foot">01 — Source Meshes</div></div></div>
    </div>
  </div>
  <noscript><p class="noscript">Surface Pencil features: Source Meshes, Area, Path, Brush, Whole Mesh and Wire Box Preview. Enable JavaScript to explore the interactive feature tour.</p></noscript>
</section>
<script>
'use strict';
// Coordinates refer to the original 546 × 1880 screenshot.
const steps=[
 {name:'SOURCE MESHES',title:'Your assets.<br><em>Your rules.</em>',text:'Choose one or more source meshes and control the contribution of each object independently. Mix vegetation, rocks, props or your own models in a single scatter layer.',note:'Amount — control how frequently each source mesh appears.',rect:[15,270,516,120],point:[32,299],tilt:[-5,4,-1]},
 {name:'AREA',title:'Draw an area.<br><em>Fill it naturally.</em>',text:'Outline a custom region on your surface and distribute your assets inside the selected boundary. Build precise coverage exactly where you want it.',note:'Ideal for garden beds, ground cover, forest patches and custom regions.',rect:[15,464,127,53],point:[36,488],tilt:[5,-3,1]},
 {name:'PATH',title:'Follow a line.<br><em>Shape the flow.</em>',text:'Create a path directly on the surface and scatter your source meshes along it. Build borders, trails and directed arrangements with precision.',note:'Ideal for linear planting, rows and natural borders.',rect:[143,464,128,53],point:[166,488],tilt:[2,3,-1]},
 {name:'BRUSH',title:'Paint your scene.<br><em>Freely.</em>',text:'Paint scatter coverage directly onto the target mesh. Adjust Brush Radius to work with narrow details or cover larger regions.',note:'Adjustable brush radius for precise or broad strokes.',rect:[273,464,129,53],point:[299,488],tilt:[-5,3,1]},
 {name:'WHOLE MESH',title:'One surface.<br><em>Full coverage.</em>',text:'Scatter across the complete selected mesh without drawing a boundary or path. Use distribution controls to refine coverage over the surface.',note:'Fast setup for terrain, fields and large environments.',rect:[404,464,128,53],point:[425,488],tilt:[4,-3,-1]},
 {name:'WIRE BOX PREVIEW',title:'Less viewport load.<br><em>More creative freedom.</em>',text:'Switch to a simplified wire-box representation while working with dense scatter layers. Keep complex environments easier to inspect and edit without displaying every detailed source mesh.',note:'A lightweight working preview. Actual performance depends on your scene and hardware.',rect:[15,632,516,39],point:[36,650],tilt:[0,0,0],red:true}
];
const $=id=>document.getElementById(id),story=$('story'),stage=$('stage'),panel=$('panel'),view=$('viewport'),win=$('window'),markers=$('markers');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// Smoothness settings: lower response time means faster tracking of the scroll.
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const embedded=window.self!==window.top;
document.documentElement.classList.toggle("embedded",embedded);

let active=-1, copyAnimation;
steps.forEach(()=> $('nav').append(document.createElement('span')));
function setStep(i){if(i===active)return;active=i;const s=steps[i];story.dataset.tone=s.red?'red':'green';$('step-no').textContent=`${String(i+1).padStart(2,'0')} / 06 — ${s.name}`;$('title').innerHTML=s.title;$('description').textContent=s.text;$('note').textContent=s.note;$('bar-label').textContent=s.name;$('window-foot').textContent=`${String(i+1).padStart(2,'0')} — ${s.name}`;[...$('nav').children].forEach((n,j)=>n.classList.toggle('active',i===j));const [x,y,w,h]=s.rect;for(const [k,v] of Object.entries({fx:x/546,fy:y/1880,fw:w/546,fh:h/1880,x:s.point[0]/546,y:s.point[1]/1880}))panel.style.setProperty('--'+k,(v*100)+'%');win.style.setProperty('--ry',s.tilt[0]+'deg');win.style.setProperty('--rx',s.tilt[1]+'deg');win.style.setProperty('--rz',s.tilt[2]+'deg');const body=$('copy-body');if(copyAnimation)copyAnimation.cancel();if(!reducedMotion.matches)copyAnimation=body.animate([{opacity:.45,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,easing:'ease-out'});pan();}
function pan(){
  // The entire relevant part of the screenshot (source through Wire Box)
  // fits inside this fixed crop. Never pan the screenshot between steps.
  panel.style.setProperty('--pan','0px');
}

// Both frames share the same GitHub Pages origin and top-level site.
// Only step messages cross this channel; position is native CSS in the host.
const channelName='arsha-surface-pencil-scroll-tour-v1';
setStep(0);
try {
  const channel=new BroadcastChannel(channelName);
  channel.onmessage=({data})=>{
    if(data?.type==='surface-pencil-step' && Number.isInteger(data.index)) {
      setStep(clamp(data.index,0,steps.length-1));
    }
  };
  channel.postMessage({type:'surface-pencil-ready'});
  window.addEventListener('pageshow',()=>channel.postMessage({type:'surface-pencil-ready'}));
} catch(error){ console.warn('Surface Pencil stage channel unavailable',error); }

</script>
</body></html>
